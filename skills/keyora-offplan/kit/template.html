<style>
/* Layout: one reading column, a ledger of the deal. Gold marks the figures that answer the question and the reader's own picks. */
:root{
  color-scheme:dark;
  --bg:#0b1220; --panel:#111a2c; --line:#24304a; --ink:#eef1f6; --soft:#a4aec2;
  --gold:#d9b25f; --gold-ink:#0b1220; --good:#5fc79a; --warn:#e3b04b; --bad:#ec7b6f; --fill:#1a2540;
  --c1:#d9b25f; --c2:#6f9be0; --c3:#5fc79a; --c4:#c58bd6; --c5:#8892a6;
  --display:"El Messiri","IBM Plex Sans Arabic",Georgia,serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f6f4ee; --panel:#ffffff; --line:#dcd6c6; --ink:#141b2b; --soft:#586178;
  --gold:#8a6514; --gold-ink:#ffffff; --good:#1c7a52; --warn:#8a5e00; --bad:#b23a2e; --fill:#ece7d8;
  --c1:#8a6514; --c2:#2f5fae; --c3:#1c7a52; --c4:#8a4aa0; --c5:#7b8496;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f6f4ee; --panel:#ffffff; --line:#dcd6c6; --ink:#141b2b; --soft:#586178;
  --gold:#8a6514; --gold-ink:#ffffff; --good:#1c7a52; --warn:#8a5e00; --bad:#b23a2e; --fill:#ece7d8;
  --c1:#8a6514; --c2:#2f5fae; --c3:#1c7a52; --c4:#8a4aa0; --c5:#7b8496;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:64px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--body);-webkit-text-size-adjust:100%}
.wrap{max-width:900px;margin-inline:auto;padding-inline:16px;padding-block:16px 48px;display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.8rem,6vw,2.7rem);font-weight:700}
h2{font-size:1.4rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--gold)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--soft);font-size:.9rem}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:8px 16px;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.2em;color:var(--gold)}
.top nav{display:flex;gap:16px;overflow-x:auto;flex:1;min-width:0;white-space:nowrap;font-size:.85rem;scrollbar-width:none}
.top nav a{color:var(--soft);text-decoration:none;padding-block:6px}
.pill{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:36px;white-space:nowrap}
.hero{display:flex;flex-direction:column;gap:14px}
.eyebrow{color:var(--gold);font-size:.85rem;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--panel);padding:10px 14px;min-width:0}
.facts div>span{display:block;color:var(--soft);font-size:.8rem}
.facts b{font-weight:600}
.lead{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:stretch}
.gal{position:relative;border-radius:12px;overflow:hidden;background:var(--fill);min-height:240px}
.gal img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.gal button{position:absolute;top:50%;translate:0 -50%;background:var(--panel);border:1px solid var(--line);border-radius:50%;width:40px;height:40px}
.gal .prev{inset-inline-start:8px}.gal .next{inset-inline-end:8px}
.gal figcaption{position:absolute;inset-inline:0;bottom:0;background:var(--panel);font-size:.8rem;padding:4px 10px;color:var(--soft)}
.verdict{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.stat>span{display:block;color:var(--soft);font-size:.85rem}
.stat b{display:block;font:700 2rem/1.2 var(--display);color:var(--gold)}
.stat em{font-style:normal;font-size:.9rem;color:var(--soft)}
section{display:flex;flex-direction:column;gap:14px}
.ctl{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:14px}
.ctl>div{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl small{color:var(--soft);min-width:90px}
.seg{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:36px}
.seg[aria-pressed="true"],.pick button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pick button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:start;min-height:44px;display:flex;flex-direction:column;gap:2px}
.pick button>span{color:var(--soft);font-size:.82rem}
.pick button>b{font-weight:600}
.pick button>strong{font:700 1.1rem var(--display)}
.pick button[aria-pressed="true"]>span{color:var(--gold-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.grid.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.cell{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell>span{color:var(--soft);font-size:.85rem}
.cell>b{font:700 1.5rem/1.3 var(--display)}
.cell p{font-size:.9rem;color:var(--soft)}
.high>b{color:var(--good)} .mid>b{color:var(--warn)} .low>b{color:var(--bad)}
.tag{font-size:.78rem;font-weight:600;font-style:normal;border:1px solid currentColor;border-radius:999px;padding:0 8px;align-self:flex-start}
.high .tag{color:var(--good)} .mid .tag{color:var(--warn)} .low .tag{color:var(--bad)}
.ruler{display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.ruler div{display:grid;grid-template-columns:minmax(120px,1.2fr) 3fr auto;gap:10px;align-items:center}
.track{background:var(--fill);border-radius:4px;height:12px;overflow:hidden}
.track i{display:block;height:100%;background:var(--c5);border-radius:4px}
.me .track i{background:var(--gold)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--panel)}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--soft);font-weight:500;font-size:.82rem;white-space:nowrap}
.on{background:var(--fill)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.kicker{font-size:.75rem;font-weight:600;letter-spacing:.06em;color:var(--gold)}
.donut{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.donut svg{width:120px;height:120px;flex:none}
.legend{display:flex;flex-direction:column;gap:4px;font-size:.88rem;flex:1;min-width:140px}
.legend div{display:flex;gap:8px;align-items:center}
.legend i{width:10px;height:10px;border-radius:2px;flex:none}
.legend span:last-child{margin-inline-start:auto}
.plan{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.plan i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.82rem;font-weight:600;background:var(--fill);border-inline-end:1px solid var(--bg);min-width:0}
.plan i.after{background:var(--gold);color:var(--gold-ink)}
ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
ul.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:8px 32px}
.confirm{border:1px solid var(--warn);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.confirm h2{font-size:1.1rem;color:var(--warn)}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:.92rem}
.steps div{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:6px}
.steps .tot{font-weight:600;border-bottom-style:solid}
.share{display:flex;flex-direction:column;gap:8px}
.share pre{margin:0;white-space:pre-wrap;font:inherit;font-size:.9rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;user-select:all}
.act{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--gold);color:var(--gold-ink);border:0;border-radius:999px;padding:8px 18px;font-weight:600;text-decoration:none;min-height:40px}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:14px;font-size:.88rem;color:var(--soft)}
.agent{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--ink)}
.agent img{height:56px;width:56px;object-fit:cover;border-radius:50%}
.agent img.logo{border-radius:0;width:auto;max-width:140px;object-fit:contain}
.credit{font-size:.8rem}
@media (max-width:480px){.facts div:last-child:nth-child(odd){grid-column:1/-1}.ruler div{grid-template-columns:1fr auto}.ruler .track{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media print{
  :root{--bg:#fff;--panel:#fff;--line:#cfc8b6;--ink:#111;--soft:#444;--gold:#7a5a12;--gold-ink:#fff;--good:#1c7a52;--warn:#8a5e00;--bad:#b23a2e;--fill:#eee9da;--c1:#7a5a12;--c2:#2f5fae;--c3:#1c7a52;--c4:#8a4aa0;--c5:#7b8496}
  .top nav,.pill,.ctl,.share,.gal button,.act{display:none} .top{position:static;border:0}
  .wrap{gap:22px;padding-block:0} section,.verdict,.confirm,.card{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
