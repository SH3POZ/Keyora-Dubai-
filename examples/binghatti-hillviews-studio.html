  const tot = items.reduce((a, x) => a + x.count, 0) || 1, R = 42, C = 2 * Math.PI * R; let off = 0;
  const arcs = items.map((x, i) => { const len = x.count / tot * C, a = `<circle cx="60" cy="60" r="${R}" fill="none" stroke="${COL[i % 5]}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`; off += len; return a; }).join("");
  const me = items.find(x => x.match) || items[0];
  return `<div class="donut"><svg viewBox="0 0 120 120" role="img" aria-label="${esc(centre)}">${arcs}<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="var(--ink)">${Math.round(me.count / tot * 100)}%</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="var(--soft)">${esc(centre)}</text></svg>
  <div class="legend">${items.map((x, i) => `<div><i style="background:${COL[i % 5]}"></i><span>${L(x.label)}</span><span>${num(n0(x.count))} · ${pct(x.count / tot * 100, 0)}</span></div>`).join("")}</div></div>`;
}
function summary(r) {
  return T[lang].sum.replace("{p}", D.project.name).replace("{u}", (D.unit.type[lang] || D.unit.type.en)).replace("{price}", moneyT(D.unit.price))
    .replace("{case}", caseName(O.c) + " · " + t(O.g)).replace("{profit}", moneyT(r.profit)).replace("{roi}", pctT(r.roi))
    .replace("{rent}", moneyT(r.netRent)).replace("{y}", pctT(r.netYield)).replace("{h}", dateStr(D.handover));
}
function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  const S = D.market.sources, s = S[O.src], cases = K.hasCases(s);
  const r = K.calc(D, P, O), lb = K.labels(r, P), pr = K.premiums(D, P);
  const PG = K.scenarios(D.market.priceGrowth12m), RG = K.scenarios(D.market.rentGrowth12m);
  const headline = r.profit <= 0 ? t("v_loss") : r.cushion < 5 ? t("v_thin") : t("v_profit");
  const sd = D.supply || {}, ph = D.photos || [], y2 = r.years.toFixed(2);
  const step = (k, v, cls) => `<div class="${cls || ""}"><span>${k}</span><span>${v}</span></div>`;
  const seg = (attr, val, on, label) => `<button type="button" class="seg" data-${attr}="${val}" aria-pressed="${on}">${label}</button>`;
  const rulerItems = [["r_y", r.priceForYield, 0, P.targetYield], ["r_pay", D.unit.price, 1], ["r_be", r.breakEven, 0], ["r_worth", r.valueToday, 0], ["r_sale", r.salePrice, 0]].sort((a, b) => a[1] - b[1]);
  const rMax = Math.max(...rulerItems.map(x => x[1]), 1);
  const hv = sd.handovers || [], hMax = Math.max(1, ...hv.map(x => x.units));
  const wa = (AGENT.whatsapp || "").replace(/[^0-9]/g, "");
  const agentName = lang === "ar" ? (AGENT.nameAr || AGENT.name) : (AGENT.name || AGENT.nameAr);
  const soc = Object.entries(AGENT.socials || {}).filter(([, u]) => /^https:\/\//.test(u || "")).map(([k, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(k)}</a>`).join(" · ");
  const nav = [["verdict", "n_verdict"], ["checks", "n_checks"], ["what", "n_what"], sd.salesByType ? ["sd", "n_sd"] : 0, ["know", "n_know"], ["plan", "n_plan"], (D.location || []).length ? ["loc", "n_loc"] : 0, ["calc", "n_calc"]].filter(Boolean);
  document.getElementById("app").innerHTML = `
  <div class="top"><span class="brand">KEYORA</span><nav>${nav.map(([id, k]) => `<a href="#${id}" data-go="${id}">${t(k)}</a>`).join("")}</nav>
    <button class="pill" id="lang-btn" type="button">${lang === "ar" ? "English" : "العربية"}</button></div>

  <header class="hero">
    <div class="eyebrow">${agentName ? esc(agentName) + " · " : ""}${t("eyebrow")} · ${dateStr(D.date)}</div>
    <h1>${esc(D.project.name)} · ${L(D.unit.type)}</h1>
    <p class="muted">${L(D.project.area)}، ${L(D.project.city)} · ${t("developer")}: ${esc(D.project.developer)}</p>
    <div class="facts">
      <div><span>${t("unit")}</span><b>${esc(D.unit.ref || "")}</b></div>
      <div><span>${t("size")}</span><b>${num(n0(D.unit.size))} ${t("sqft")}</b></div>
      <div><span>${t("price")}</span><b>${money(D.unit.price)}</b></div>
      <div><span>${t("psf")}</span><b>${money(r.unitPsf)}</b></div>
      <div><span>${t("handover")}</span><b>${dateStr(D.handover)}</b></div>
    </div>
  </header>

  <div class="lead" id="verdict">
    ${ph.length ? `<figure class="gal" style="margin:0"><img src="${esc(D._photoDir)}/${esc(ph[shot % ph.length].file)}" alt="${L(ph[shot % ph.length].caption)}">
      ${ph.length > 1 ? `<button type="button" class="prev" data-shot="-1" aria-label="previous">‹</button><button type="button" class="next" data-shot="1" aria-label="next">›</button>` : ""}
      <figcaption>${num((shot % ph.length + 1) + " / " + ph.length)} · ${L(ph[shot % ph.length].caption)}</figcaption></figure>` : ""}
    <div class="verdict">
      <h2>${headline}</h2>
      <div class="stat"><span>${t("sellAt")}</span><b>${money(r.profit)}</b><em>${pct(r.roi)} ${t("onCost")}</em></div>
      <div class="stat"><span>${t("rentOut")}</span><b>${pct(r.netYield)}</b><em>${t("netYield")} · ${money(r.netRent)} ${t("perYear")}</em></div>
      <p class="muted">${t("basedOn")} ${esc(s.name)}${cases ? " · " + caseName(O.c) : ""} · ${t(O.g)} (${pct(r.priceGrowth)}) · ${t("rentW")} ${pct(r.rentGrowth)}</p>
    </div>
  </div>

  <div class="ctl">
    ${S.length > 1 ? `<div><small>${t("show")}</small>${S.map((x, i) => seg("src", i, i === O.src, esc(x.name))).join("")}</div>` : ""}
    ${cases ? `<div><small>${t("caseL")}</small>${K.CASES.map(c => seg("case", c, c === O.c, caseName(c))).join("")}</div>` : ""}
    <div class="act"><button type="button" class="seg" data-reset="1">★ ${t("reset")}</button>${D._print ? `<button type="button" class="seg" data-print="1">${t("pdf")}</button>` : ""}</div>
  </div>

  <section id="checks">
    <h2>${t("checksTitle")}</h2>
    <div class="grid">
      <div class="cell ${lb.price === "above" ? "mid" : "high"}"><span>${t("c_price")}</span><b>${pct(r.priceVsArea)}</b><i class="tag">${t(lb.price)}</i><p>${t("p_price", money(r.unitPsf), money(r.psf))}</p></div>
      <div class="cell ${lb.cushion}"><span>${t("c_cushion")}</span><b>${pct(r.cushion)}</b><i class="tag">${qual(lb.cushion)}</i><p>${t("p_cushion", money(r.valueToday), money(r.breakEven))}</p></div>
      <div class="cell"><span>${t("c_be")}</span><b>${money(r.breakEven)}</b><p>${t("p_be")}</p></div>
      <div class="cell ${lb.yield}"><span>${t("c_yield")}</span><b>${pct(r.netYield)}</b><i class="tag">${qual(lb.yield)}</i><p>${t("p_yield", money(r.netRent), money(r.totalCost))}</p></div>
    </div>
    <h3>${t("rulerTitle")}</h3>
    <div class="ruler">${rulerItems.map(([k, v, me, a]) => `<div class="${me ? "me" : ""}"><span>${t(k, a)}</span><div class="track"><i style="width:${Math.max(2, v / rMax * 100).toFixed(1)}%"></i></div><span>${money(v)}</span></div>`).join("")}</div>
  </section>

  <section id="what">
    <h2>${t("whatTitle")}</h2>
    <h3>${t("stepA")}</h3>
    <div class="pick">${K.KEYS.map(k => { const x = K.calc(D, P, { ...O, g: k }); return `<button type="button" data-g="${k}" aria-pressed="${k === O.g}"><b>${t(k)}${k === DEF.g ? " ★" : ""}</b><span>${pct(PG[k])} ${t("growth")}</span><strong>${money(x.profit)}</strong><span>${t("profitL")} · ${pct(x.roi)}</span></button>`; }).join("")}</div>
    ${cases ? `<p class="muted">${t("casesTitle")}</p><div class="grid three">${K.CASES.map(c => { const x = K.calc(D, P, { ...O, c }); return `<div class="cell ${c === O.c ? "on" : ""}"><span>${caseName(c)} · ${money(x.psf)}</span><b>${money(x.salePrice)}</b><p>${t("profitL")} ${money(x.profit)} · ${pct(x.roi)}</p></div>`; }).join("")}</div>` : ""}
    <h3>${t("stepB")}</h3>
    <div class="pick">${K.KEYS.map(k => { const x = K.calc(D, P, { ...O, r: k }); return `<button type="button" data-r="${k}" aria-pressed="${k === O.r}"><b>${t(k)}${k === DEF.r ? " ★" : ""}</b><span>${pct(RG[k])} ${t("growth")}</span><strong>${money(x.netRent)}</strong><span>${t("netRentL")} · ${pct(x.netYield)}</span></button>`; }).join("")}</div>
    <p class="muted">${t("rentNote")}</p>
    <h3>${t("holdTitle", r.holdYears)}</h3>
    <div class="scroll"><table>
      <tr><td>${t("h_rent")}</td><td>${money(r.holdRents)}</td></tr><tr><td>${t("h_value")}</td><td>${money(r.holdValue)}</td></tr>
      <tr><td>${t("h_profit")}</td><td><b>${money(r.holdProfit)}</b></td></tr><tr><td>${t("h_roi")}</td><td>${pct(r.holdRoi)}</td></tr>
      ${r.payback ? `<tr><td>${t("payback")}</td><td>${num(r.payback.toFixed(1))}</td></tr>` : ""}
    </table></div>
  </section>

  ${sd.salesByType ? `<section id="sd">
    <h2>${t("sdTitle")}</h2>
    <div class="duo">
      <div class="card"><span class="kicker">${t("demand")}</span><b>${t("selling")}</b>${donut(sd.salesByType, t("ofSales"))}<p class="muted">${L(sd.salesPeriod)}</p></div>
      ${sd.buildingMix ? `<div class="card"><span class="kicker">${t("building")}</span><b>${t("mix")}</b>${donut(sd.buildingMix, t("ofUnits"))}${sd.project ? `<p class="muted">${t("unitsSold", num(n0(sd.project.sold)), num(n0(sd.project.units)))}</p>` : ""}</div>` : ""}
    </div>
    ${hv.length ? `<div class="card"><span class="kicker">${t("supplyK")}</span><b>${t("hand")}</b><div class="ruler">${hv.map(x => `<div class="${x.mark ? "me" : ""}"><span>${esc(x.year)}${x.mark ? " · " + esc(D.project.name) : ""}</span><div class="track"><i style="width:${(x.units / hMax * 100).toFixed(1)}%"></i></div><span>${num(n0(x.units))}</span></div>`).join("")}</div></div>` : ""}
    ${sd.area ? `<p>${t("upcoming", num(n0(sd.area.upcomingUnits)), num(sd.area.upcomingProjects))}</p>` : ""}
  </section>` : ""}

  <section id="know">
    ${(D.notes || []).length ? `<h2>${t("notesTitle")}</h2><ul class="cols">${D.notes.map(x => `<li>${L(x)}</li>`).join("")}</ul>` : ""}
    ${(D.assumptions || []).length ? `<div class="confirm"><h2>${t("confirmTitle")}</h2><ul>${D.assumptions.map(x => `<li>${L(x)}</li>`).join("")}</ul></div>` : ""}
  </section>

  <section id="plan">
    <h2>${t("planTitle")}</h2>
    <div class="plan" dir="ltr">${D.plan.map(p => `<i class="${p.beforeHandover ? "" : "after"}" style="width:${p.pct}%">${p.pct}%</i>`).join("")}</div>
    <div class="scroll"><table>${D.plan.map(p => `<tr><td>${L(p.label)}</td><td>${L(p.when)}</td><td>${pct(p.pct, 0)}</td><td>${money(D.unit.price * p.pct / 100)}</td></tr>`).join("")}</table></div>
    <p><b>${t("cashBefore")}:</b> ${money(r.cashIn)}</p><p class="muted">${t("cashHelp", r.paidPct)}</p>
  </section>

  ${(D.location || []).length ? `<section id="loc"><h2>${t("locTitle")}</h2><p class="muted">${t("locNote")}</p>
    <div class="grid">${D.location.map(c => `<div class="cell"><span>${L(c.title)}</span><h3>${L(c.headline)}</h3><p>${L(c.text)}</p>${/^https:\/\//.test(c.source || "") ? `<a href="${esc(c.source)}" target="_blank" rel="noopener">${esc(c.sourceName || t("src"))}</a>` : ""}</div>`).join("")}</div></section>` : ""}

  <section id="calc">
    <h2>${t("calcTitle")}</h2><p class="muted">${t("calcSub")}</p>
    <div class="scroll"><table><caption class="muted" style="text-align:start;padding:8px 12px">${t("cmpTitle")}</caption>
      <tr><th>${t("src")}</th><th>${t("rentCol")}</th><th>${t("psfLowCol")}</th><th>${t("psfHighCol")}</th><th>${t("period")}</th><th>${t("sample")}</th></tr>
      ${S.map((x, i) => `<tr class="${i === O.src ? "on" : ""}"><td>${esc(x.name)}</td><td>${money(x.rent)}</td><td>${typeof x.psfLow === "number" ? money(x.psfLow) : "–"}</td><td>${typeof x.psfHigh === "number" ? money(x.psfHigh) : "–"}</td><td>${L(x.period)}</td><td>${L(x.sample)}</td></tr>`).join("")}</table></div>
    <div class="scroll"><table><caption class="muted" style="text-align:start;padding:8px 12px">${t("growTitle")}</caption>
      <tr><th></th><th>${t("g12")}</th><th>${t("gUsed")}</th></tr>
      <tr><td>${t("priceW")}</td><td>${typeof D.market.priceGrowth12m === "number" ? pct(D.market.priceGrowth12m) : t("na")}</td><td>${pct(r.priceGrowth)}</td></tr>
      <tr><td>${t("rentW")}</td><td>${typeof D.market.rentGrowth12m === "number" ? pct(D.market.rentGrowth12m) : t("na")}</td><td>${pct(r.rentGrowth)}</td></tr></table></div>
    <h3>${t("premTitle")}</h3>
    ${pr.list.length ? `<div class="grid">${pr.list.map(x => `<div class="cell"><span>${L(x.label)}</span><b>+${x.rent}% ${t("premRent")} · +${x.price}% ${t("premPrice")}</b><p>${L(x.why)}</p></div>`).join("")}</div>
      <p class="muted">${t("premTotal", P.caps.rent, P.caps.price)}: +${pr.rent}% ${t("premRent")} · +${pr.price}% ${t("premPrice")}</p>` : `<p class="muted">${t("premNone")}</p>`}
    <details id="calc-box" ${openCalc ? "open" : ""}>
      <summary>${t("buySide")} · ${t("sellSide")} · ${t("rentSide")}</summary>
      <div class="steps"><b>${t("buySide")}</b>
        ${step(t("s_price"), money(D.unit.price))}${step(t("s_dld", D.costs.dldPct), money(r.dld))}${step(t("s_admin"), money(D.costs.adminFee))}${step(t("s_total"), money(r.totalCost), "tot")}
        <b>${t("sellSide")}</b>
        ${step(t("s_value", n0(r.psf), n0(D.unit.size)), money(r.valueToday))}${step(t("s_grow", r.priceGrowth, y2), "× " + num(Math.pow(1 + r.priceGrowth / 100, r.years).toFixed(4)))}${r.premPrice ? step(t("s_prem", r.premPrice), "× " + num((1 + r.premPrice / 100).toFixed(4))) : ""}${step(t("s_sale"), money(r.salePrice))}${step(t("s_comm", D.costs.sellCommissionPct, D.costs.vatPct), money(-r.sellCost))}${step(t("s_total"), money(-r.totalCost))}${step(t("s_profit"), money(r.profit), "tot")}
        <b>${t("rentSide")}</b>
        ${step(t("s_rent"), money(s.rent))}${step(t("s_rgrow", r.rentGrowth, y2) + r.premRent + "%", money(r.grossRent - (D.costs.furnishedPremium || 0)))}${D.costs.furnishedPremium ? step(t("s_furn"), money(D.costs.furnishedPremium)) : ""}${step(t("s_vac", D.costs.vacancyPct), money(-r.vacancy))}${step(t("s_mgmt", D.costs.managementPct), money(-r.management))}${step(t("s_sc", D.costs.serviceChargePsf), money(-r.serviceCharge))}${r.other ? step(t("s_other"), money(-r.other)) : ""}${step(t("s_net"), money(r.netRent), "tot")}
        ${step(t("netYield") + " = " + t("s_net") + " ÷ " + t("s_total"), pct(r.netYield, 2), "tot")}
      </div>
    </details>
    <h3>${t("srcTitle")}</h3>
    <div class="scroll"><table><tr><th>${t("src")}</th><th>${t("what")}</th><th>${t("period")}</th><th>${t("pulled")}</th></tr>
    ${D.sources.map(x => `<tr><td>${/^https:\/\//.test(x.url || "") ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}</a>` : esc(x.name)}</td><td>${L(x.what)}</td><td>${L(x.period)}</td><td>${dateStr(x.pulled)}</td></tr>`).join("")}</table></div>
  </section>

  <div class="share"><h3>${t("shareTitle")}</h3><pre id="sum">${esc(summary(r))}</pre><div class="act"><button type="button" class="btn" data-copy="1">${t("copy")}</button></div></div>

  <footer>
    ${agentName || AGENT._logo ? `<div class="agent">${AGENT._logo ? `<img class="logo" src="${AGENT._logo}" alt="">` : ""}${AGENT._photo ? `<img src="${AGENT._photo}" alt="">` : ""}
      <div><span class="muted">${t("prepared")}</span><br><b>${esc(agentName || "")}</b>${AGENT.company ? " · " + esc(AGENT.company) : ""}${AGENT.brn ? " · BRN " + esc(AGENT.brn) : ""}${AGENT.whatsapp ? `<br>${num(esc(AGENT.whatsapp))}` : ""}</div>
      ${wa ? `<a class="btn" href="https://wa.me/${wa}?text=${encodeURIComponent(t("waMsg", D.project.name))}" target="_blank" rel="noopener">${t("wa")}</a>` : ""}</div>` : ""}
    ${soc ? `<div>${soc}</div>` : ""}
    <p>${t("disclaimer", dateStr(D.date))}</p>
    <p class="credit">KEYORA · Off-plan Calculator v1.1 © 2026 Hassan Abu El-Leil · حسن أبو الليل</p>
  </footer>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-go]"); if (!b) return;
  const d = b.dataset, box = document.getElementById("calc-box"); if (box) openCalc = box.open;
  if (d.go) { e.preventDefault(); const el = document.getElementById(d.go); if (el) el.scrollIntoView(); return; }
  if (d.copy) { const txt = document.getElementById("sum").textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(() => { b.textContent = T[lang].copied; })
      .catch(() => { const g = getSelection(), rg = document.createRange(); rg.selectNodeContents(document.getElementById("sum")); g.removeAllRanges(); g.addRange(rg); });
    return; }
  if (d.print) { try { window.print(); } catch (err) {} return; }
  if (b.id === "lang-btn") lang = lang === "ar" ? "en" : "ar";
  else if (d.src != null) O.src = +d.src; else if (d.case) O.c = d.case; else if (d.g) O.g = d.g; else if (d.r) O.r = d.r;
  else if (d.reset) O = { ...DEF }; else if (d.shot) shot = (shot + +d.shot + (D.photos || []).length) % (D.photos || []).length;
  else return;
  render();
});
window.addEventListener("beforeprint", () => { O = { ...DEF }; openCalc = true; render(); });
render();
</script>

</body>
</html>
