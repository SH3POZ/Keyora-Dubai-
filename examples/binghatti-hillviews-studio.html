}

  color-scheme:light;

}}

.wrap{max-width:860px;margin-inline:auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:36px}
h1,h2{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(1.8rem,6vw,2.7rem);font-weight:700}
h2{font-size:1.4rem;font-weight:700}
p{margin:0}
a{color:var(--gold)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--soft);font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.22em;color:var(--gold);font-size:1.05rem}
.brand small{display:block;letter-spacing:0;color:var(--soft);font:400 .78rem var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
.lang{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 14px;min-height:40px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{display:flex;flex-direction:column;gap:14px}
.eyebrow{color:var(--gold);font-size:.85rem;font-weight:600}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{background:var(--panel);padding:10px 14px;min-width:0}
.facts div>span{display:block;color:var(--soft);font-size:.8rem}
.facts b{font-weight:600}
.verdict{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.verdict h2{font-size:1.25rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.stat>span{display:block;color:var(--soft);font-size:.85rem}
.stat b{display:block;font:700 2rem/1.2 var(--display);color:var(--gold)}
.stat em{font-style:normal;font-size:.9rem;color:var(--soft)}
section{display:flex;flex-direction:column;gap:14px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pick button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:start;min-height:44px}
.pick button b{display:block;font-weight:600}
.pick button>span{color:var(--soft);font-size:.82rem}
.pick button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold);color:var(--gold-ink)}
.pick button[aria-pressed="true"]>span{color:var(--gold-ink)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.check{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.check>span{color:var(--soft);font-size:.85rem}
.check b{font:700 1.5rem/1.3 var(--display)}
.check p{font-size:.9rem;color:var(--soft)}
.high b{color:var(--good)} .mid b{color:var(--warn)} .low b{color:var(--bad)}
.tag{font-size:.78rem;font-weight:600;border:1px solid currentColor;border-radius:999px;padding:0 8px;align-self:flex-start}
.high .tag{color:var(--good)} .mid .tag{color:var(--warn)} .low .tag{color:var(--bad)}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--panel)}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{color:var(--soft);font-weight:500;font-size:.82rem;white-space:nowrap}
td.on,th.on{background:var(--fill)}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:minmax(90px,1fr) 3fr auto;gap:10px;align-items:center;font-size:.92rem}
.track{background:var(--fill);border-radius:4px;height:14px;overflow:hidden}
.track i{display:block;height:100%;background:var(--soft);border-radius:4px}
.row.me .track i{background:var(--gold)}
.plan{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.plan i{display:flex;align-items:center;justify-content:center;font-style:normal;font-size:.82rem;font-weight:600;background:var(--fill);border-inline-end:1px solid var(--bg);min-width:0}
.plan i.after{background:var(--gold);color:var(--gold-ink)}
ul{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px}
.confirm{border:1px solid var(--warn);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
.confirm h2{font-size:1.1rem;color:var(--warn)}
details{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.steps{display:flex;flex-direction:column;gap:8px;margin-top:12px;font-size:.92rem}

.steps .tot{font-weight:600;border-bottom-style:solid}
footer{border-top:1px solid var(--line);padding-top:20px;display:flex;flex-direction:column;gap:14px;font-size:.88rem;color:var(--soft)}
.agent{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:var(--ink)}
.agent img{height:56px;width:56px;object-fit:cover;border-radius:50%}
.agent img.logo{border-radius:0;width:auto;max-width:140px;object-fit:contain}
.wa{display:inline-block;background:var(--gold);color:var(--gold-ink);text-decoration:none;font-weight:600;border-radius:999px;padding:8px 18px}
.credit{font-size:.8rem}

@media print{
  :root{--bg:#fff;--panel:#fff;--line:#cfc8b6;--ink:#111;--soft:#444;--gold:#7a5a12;--gold-ink:#fff;--good:#1c7a52;--warn:#8a5e00;--bad:#b23a2e;--fill:#eee9da}

}

<script>

(function (root) {
  "use strict";
  function yearsBetween(a, b) {
    var ms = new Date(b + "T00:00:00Z") - new Date(a + "T00:00:00Z");
    return Math.max(0, ms / (365.25 * 24 * 3600 * 1000));
  }
  /* Growth scenarios. g12 = change over the last 12 months (%), may be null.
     stress -5 · flat 0 · base = half of g12, between 0 and 6 · strong = g12, between 0 and 10 */
  function scenarios(g12) {
    var g = (typeof g12 === "number" && isFinite(g12)) ? g12 : 0;
    var clamp = function (v, lo, hi) { return Math.min(hi, Math.max(lo, v)); };
    return { stress: -5, flat: 0, base: clamp(g / 2, 0, 6), strong: clamp(g, 0, 10) };
  }
  function calc(D, key) {
    var c = D.costs, u = D.unit, m = D.market;
    var years = yearsBetween(D.date, D.handover);
    var pg = scenarios(m.priceGrowth12m)[key], rg = scenarios(m.rentGrowth12m)[key];
    var dld = u.price * c.dldPct / 100;
    var totalCost = u.price + dld + c.adminFee;
    var unitPsf = u.price / u.size;
    var priceVsArea = (unitPsf - m.areaPsf) / m.areaPsf * 100;
    var valueToday = m.areaPsf * u.size;
    /* rent */
    var grossRent = m.areaRent * Math.pow(1 + rg / 100, years);
    var vacancy = grossRent * c.vacancyPct / 100;
    var management = grossRent * c.managementPct / 100;
    var serviceCharge = c.serviceChargePsf * u.size;
    var netRent = grossRent - vacancy - management - serviceCharge;
    var grossYield = grossRent / u.price * 100;
    var netYield = netRent / totalCost * 100;
    var payback = netRent > 0 ? totalCost / netRent : null;
    /* resale at handover */
    var sellRate = c.sellCommissionPct / 100 * (1 + c.vatPct / 100);
    var salePrice = valueToday * Math.pow(1 + pg / 100, years);
    var sellCost = salePrice * sellRate;
    var profit = salePrice - sellCost - totalCost;
    var roi = profit / totalCost * 100;
    var paidPct = 0;
    (D.plan || []).forEach(function (p) { if (p.beforeHandover) paidPct += p.pct; });
    var cashIn = u.price * paidPct / 100 + dld + c.adminFee;
    var cashReturn = profit / cashIn * 100;
    var breakEven = totalCost / (1 - sellRate);
    var cushion = (valueToday - breakEven) / valueToday * 100;
    return { years: years, priceGrowth: pg, rentGrowth: rg, dld: dld, totalCost: totalCost,
      unitPsf: unitPsf, priceVsArea: priceVsArea, valueToday: valueToday,
      grossRent: grossRent, vacancy: vacancy, management: management, serviceCharge: serviceCharge,
      netRent: netRent, grossYield: grossYield, netYield: netYield, payback: payback,
      sellRate: sellRate, salePrice: salePrice, sellCost: sellCost, profit: profit, roi: roi,
      paidPct: paidPct, cashIn: cashIn, cashReturn: cashReturn, breakEven: breakEven, cushion: cushion };
  }
  /* Plain labels. Thresholds are documented in references/formulas.md */
  function labels(r) {
    return {
      yield: r.netYield >= 6 ? "high" : r.netYield >= 4.5 ? "mid" : "low",
      price: r.priceVsArea <= -3 ? "below" : r.priceVsArea <= 3 ? "inline" : "above",
      cushion: r.cushion >= 5 ? "high" : r.cushion >= 0 ? "mid" : "low",
      profit: r.profit > 0 ? "high" : "low"
    };
  }

 tableTitle:"كل السيناريوهات جنباً إلى جنب",salePrice:"سعر البيع عند الاستلام",profit:"الربح بعد كل التكاليف",roi:"العائد على إجمالي التكلفة",cashReturn:"العائد على المدفوع قبل الاستلام",grossRent:"إجمالي الإيجار سنوياً",
 sdTitle:"العرض والطلب",selling:"ما الذي يُباع في المنطقة",project:"هذا المشروع",unitsSold:"تم بيع {a} من {b} وحدة",areaSupply:"المعروض القادم في المنطقة",upcoming:"{a} وحدة في {b} مشاريع تحت الإنشاء",
 planTitle:"خطة الدفع",cashBefore:"السيولة المطلوبة قبل الاستلام",cashHelp:"{a}% من السعر، مع رسوم الأراضي والرسوم الإدارية.",
 notesTitle:"معلومات مهمة",confirmTitle:"يجب التأكد منه قبل الاعتماد على التقرير",
 calcTitle:"كيف حُسب كل رقم",s_price:"سعر الوحدة",s_dld:"رسوم دائرة الأراضي ({a}%)",s_admin:"الرسوم الإدارية",s_total:"إجمالي التكلفة",
 s_value:"القيمة اليوم بسعر المنطقة ({a} × {b} قدم²)",s_grow:"نمو السعر {a}% سنوياً لمدة {b} سنة",s_sale:"سعر البيع عند الاستلام",s_comm:"عمولة البيع ({a}% + {b}% ضريبة)",s_profit:"الربح",
 s_rent:"إيجار المنطقة سنوياً",s_rgrow:"نمو الإيجار {a}% سنوياً لمدة {b} سنة",s_vac:"فترات الشغور ({a}%)",s_mgmt:"إدارة العقار ({a}%)",s_sc:"رسوم الخدمات ({a} للقدم)",s_net:"صافي الإيجار سنوياً",
 buySide:"الشراء",sellSide:"البيع عند الاستلام",rentSide:"التأجير",
 srcTitle:"المصادر",src:"المصدر",what:"استُخدم في",period:"الفترة",pulled:"تاريخ السحب",
 prepared:"إعداد",wa:"راسلني واتساب عن هذه الوحدة",waMsg:"مرحباً، مهتم بوحدة في {a}",
 disclaimer:"تقديرات مبنية على بيانات السوق بتاريخ {a} والمعلومات المنشورة من المطوّر. الأسعار والإيجارات والرسوم قابلة للتغيّر، والنمو السابق لا يضمن النمو القادم. هذا ليس نصيحة مالية. تأكد من كل الرسوم وخطة الدفع مع المطوّر ودائرة الأراضي والأملاك قبل الشراء."}
};
let lang = D.lang === "en" ? "en" : "ar", pick = "base";
if (location.hash === "#en" || location.hash === "#ar") lang = location.hash.slice(1);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const t = (k, a, b) => T[lang][k].replace("{a}", a).replace("{b}", b);
const L = o => esc(o && typeof o === "object" ? (o[lang] || o.en || "") : o);
const n0 = v => Math.round(v).toLocaleString("en-US");
const num = s => `<span class="num">${s}</span>`;
const money = v => `${num((v < 0 ? "−" : "") + n0(Math.abs(v)))} ${T[lang].aed}`;
const pct = (v, d = 1) => num((v < 0 ? "−" : "") + Math.abs(v).toFixed(d) + "%");
const dateStr = s => new Date(s + "T00:00:00Z").toLocaleDateString(lang === "ar" ? "ar-EG-u-nu-latn" : "en-GB", {day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});

function render() {
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  const r = KEYORA.calc(D, pick), lb = KEYORA.labels(r), S = KEYORA.scenarios(D.market.priceGrowth12m);
  const all = KEYORA.KEYS.map(k => [k, KEYORA.calc(D, k)]);
  const headline = r.profit <= 0 ? t("v_loss") : r.cushion < 5 ? t("v_thin") : t("v_profit");
  const sd = D.supply || {}, maxSale = Math.max(1, ...(sd.salesByType || []).map(x => x.count));
  const totalSales = (sd.salesByType || []).reduce((a, x) => a + x.count, 0);
  const step = (k, v, cls) => `<div class="${cls || ""}"><span>${k}</span><span>${v}</span></div>`;
  const y2 = r.years.toFixed(2);
  const wa = (AGENT.whatsapp || "").replace(/[^0-9]/g, "");
  const agentName = lang === "ar" ? (AGENT.nameAr || AGENT.name) : (AGENT.name || AGENT.nameAr);
  const soc = Object.entries(AGENT.socials || {}).filter(([, u]) => /^https:\/\//.test(u || ""))
    .map(([k, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(k)}</a>`).join(" · ");
  document.getElementById("app").innerHTML = `
  <div class="bar"><div class="brand">KEYORA<small>${t("brandSub")}</small></div>
    <button class="lang" id="lang-btn" type="button">${lang === "ar" ? "English" : "العربية"}</button></div>

  <header class="hero">
    <div class="eyebrow">${t("eyebrow")} · ${dateStr(D.date)}</div>
    <h1>${esc(D.project.name)} · ${L(D.unit.type)}</h1>
    <p class="muted">${L(D.project.area)}، ${L(D.project.city)} · ${t("developer")}: ${esc(D.project.developer)}</p>
    <div class="facts">
      <div><span>${t("unit")}</span><b>${esc(D.unit.ref || "")}</b></div>
      <div><span>${t("size")}</span><b>${num(n0(D.unit.size))} ${t("sqft")}</b></div>
      <div><span>${t("price")}</span><b>${money(D.unit.price)}</b></div>
      <div><span>${t("psf")}</span><b>${money(r.unitPsf)}</b></div>
      <div><span>${t("handover")}</span><b>${dateStr(D.handover)}</b></div>
    </div>
  </header>

  <div class="verdict">
    <h2>${headline}</h2>
    <div class="two">
      <div class="stat"><span>${t("sellAt")}</span><b>${money(r.profit)}</b><em>${pct(r.roi)} ${t("onCost")}</em></div>
      <div class="stat"><span>${t("rentOut")}</span><b>${pct(r.netYield)}</b><em>${t("netYield")} · ${money(r.netRent)} ${t("perYear")}</em></div>
    </div>
    <p class="muted">${t("basedOn")} ${t(pick)} (${pct(r.priceGrowth)} ${t("growth")})</p>
  </div>

  <section>
    <h2>${t("pickTitle")}</h2><p class="muted">${t("pickHelp")}</p>
    <div class="pick">${KEYORA.KEYS.map(k => `<button type="button" data-pick="${k}" aria-pressed="${k === pick}"><b>${t(k)}</b><span>${pct(S[k])} ${t("growth")}</span></button>`).join("")}</div>
  </section>

  <section>
    <h2>${t("checksTitle")}</h2>
    <div class="checks">
      <div class="check ${lb.price === "above" ? "mid" : "high"}"><span>${t("c_price")}</span><b>${pct(r.priceVsArea)}</b><i class="tag">${t(lb.price)}</i><p>${t("p_price", money(r.unitPsf), money(D.market.areaPsf))}</p></div>
      <div class="check ${lb.cushion}"><span>${t("c_cushion")}</span><b>${pct(r.cushion)}</b><i class="tag">${t(lb.cushion)}</i><p>${t("p_cushion", money(r.valueToday), money(r.breakEven))}</p></div>
      <div class="check"><span>${t("c_be")}</span><b>${money(r.breakEven)}</b><p>${t("p_be")}</p></div>
      <div class="check ${lb.yield}"><span>${t("c_yield")}</span><b>${pct(r.netYield)}</b><i class="tag">${t(lb.yield)}</i><p>${t("p_yield", money(r.netRent), money(r.totalCost))}</p></div>
    </div>
  </section>

  <section>
    <h2>${t("tableTitle")}</h2>
    <div class="scroll"><table>
      <tr><th></th>${all.map(([k, x]) => `<th class="${k === pick ? "on" : ""}">${t(k)}<br>${pct(x.priceGrowth)}</th>`).join("")}</tr>
      ${[["salePrice", x => money(x.salePrice)], ["profit", x => money(x.profit)], ["roi", x => pct(x.roi)], ["cashReturn", x => pct(x.cashReturn)], ["grossRent", x => money(x.grossRent)], ["netRent", x => money(x.netRent)], ["netYield", x => pct(x.netYield)]]
        .map(([k, f]) => `<tr><td>${t(k)}</td>${all.map(([kk, x]) => `<td class="${kk === pick ? "on" : ""}">${f(x)}</td>`).join("")}</tr>`).join("")}
    </table></div>
  </section>

  ${sd.salesByType ? `<section>
    <h2>${t("sdTitle")}</h2>
    <p><b>${t("selling")}</b></p>
    <div class="rows">${sd.salesByType.map(x => `<div class="row ${x.match ? "me" : ""}"><span>${L(x.label)}</span><div class="track"><i style="width:${(x.count / maxSale * 100).toFixed(1)}%"></i></div><span>${num(n0(x.count))} · ${pct(x.count / totalSales * 100, 0)}</span></div>`).join("")}</div>
    <p class="muted">${L(sd.salesPeriod)}</p>
    ${sd.project ? `<p><b>${t("project")}</b></p>
    <div class="rows"><div class="row me"><span>${pct(sd.project.sold / sd.project.units * 100, 0)}</span><div class="track"><i style="width:${(sd.project.sold / sd.project.units * 100).toFixed(1)}%"></i></div><span>${t("unitsSold", num(n0(sd.project.sold)), num(n0(sd.project.units)))}</span></div></div>` : ""}
    ${sd.area ? `<p><b>${t("areaSupply")}</b></p><p>${t("upcoming", num(n0(sd.area.upcomingUnits)), num(sd.area.upcomingProjects))}</p>` : ""}
  </section>` : ""}

  <section>
    <h2>${t("planTitle")}</h2>
    <div class="plan" dir="ltr">${D.plan.map(p => `<i class="${p.beforeHandover ? "" : "after"}" style="width:${p.pct}%">${p.pct}%</i>`).join("")}</div>
    <div class="scroll"><table>${D.plan.map(p => `<tr><td>${L(p.label)}</td><td>${L(p.when)}</td><td>${pct(p.pct, 0)}</td><td>${money(D.unit.price * p.pct / 100)}</td></tr>`).join("")}</table></div>
    <p><b>${t("cashBefore")}:</b> ${money(r.cashIn)}</p><p class="muted">${t("cashHelp", r.paidPct)}</p>
  </section>

  ${(D.location || []).length ? `<section><div class="checks">${D.location.map(c => `<div class="check"><span>${L(c.title)}</span><p>${L(c.text)}</p>${/^https:\/\//.test(c.source || "") ? `<a href="${esc(c.source)}" target="_blank" rel="noopener">${t("src")}</a>` : ""}</div>`).join("")}</div></section>` : ""}

  ${(D.notes || []).length ? `<section><h2>${t("notesTitle")}</h2><ul>${D.notes.map(x => `<li>${L(x)}</li>`).join("")}</ul></section>` : ""}

  ${(D.assumptions || []).length ? `<div class="confirm"><h2>${t("confirmTitle")}</h2><ul>${D.assumptions.map(x => `<li>${L(x)}</li>`).join("")}</ul></div>` : ""}

  <details id="calc-box" ${window.__calcOpen ? "open" : ""}>
    <summary>${t("calcTitle")}</summary>
    <div class="steps"><b>${t("buySide")}</b>
      ${step(t("s_price"), money(D.unit.price))}${step(t("s_dld", D.costs.dldPct), money(r.dld))}${step(t("s_admin"), money(D.costs.adminFee))}${step(t("s_total"), money(r.totalCost), "tot")}
      <b>${t("sellSide")} · ${t(pick)}</b>
      ${step(t("s_value", n0(D.market.areaPsf), n0(D.unit.size)), money(r.valueToday))}${step(t("s_grow", r.priceGrowth, y2), "× " + num(Math.pow(1 + r.priceGrowth / 100, r.years).toFixed(4)))}${step(t("s_sale"), money(r.salePrice))}${step(t("s_comm", D.costs.sellCommissionPct, D.costs.vatPct), money(-r.sellCost))}${step(t("s_total"), money(-r.totalCost))}${step(t("s_profit"), money(r.profit), "tot")}
      <b>${t("rentSide")}</b>
      ${step(t("s_rent"), money(D.market.areaRent))}${step(t("s_rgrow", r.rentGrowth, y2), money(r.grossRent))}${step(t("s_vac", D.costs.vacancyPct), money(-r.vacancy))}${step(t("s_mgmt", D.costs.managementPct), money(-r.management))}${step(t("s_sc", D.costs.serviceChargePsf), money(-r.serviceCharge))}${step(t("s_net"), money(r.netRent), "tot")}
      ${step(t("netYield") + " = " + t("s_net") + " ÷ " + t("s_total"), pct(r.netYield, 2), "tot")}
    </div>
  </details>

  <section>
    <h2>${t("srcTitle")}</h2>
    <div class="scroll"><table><tr><th>${t("src")}</th><th>${t("what")}</th><th>${t("period")}</th><th>${t("pulled")}</th></tr>
    ${D.sources.map(s => `<tr><td>${/^https:\/\//.test(s.url || "") ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>` : esc(s.name)}</td><td>${L(s.what)}</td><td>${L(s.period)}</td><td>${dateStr(s.pulled)}</td></tr>`).join("")}</table></div>
  </section>

  <footer>
    ${agentName || AGENT._logo ? `<div class="agent">${AGENT._logo ? `<img class="logo" src="${AGENT._logo}" alt="">` : ""}${AGENT._photo ? `<img src="${AGENT._photo}" alt="">` : ""}
      <div><span class="muted">${t("prepared")}</span><br><b>${esc(agentName || "")}</b>${AGENT.company ? " · " + esc(AGENT.company) : ""}${AGENT.brn ? " · BRN " + esc(AGENT.brn) : ""}${AGENT.whatsapp ? `<br>${num(esc(AGENT.whatsapp))}` : ""}</div>
      ${wa ? `<a class="wa" href="https://wa.me/${wa}?text=${encodeURIComponent(t("waMsg", D.project.name))}" target="_blank" rel="noopener">${t("wa")}</a>` : ""}</div>` : ""}
    ${soc ? `<div>${soc}</div>` : ""}
    <p>${t("disclaimer", dateStr(D.date))}</p>
    <p class="credit">KEYORA · Off-plan Calculator v1.0 © 2026 Hassan Abu El-Leil · حسن أبو الليل</p>
  </footer>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pick]"), l = e.target.closest("#lang-btn");
  if (!b && !l) return;
  window.__calcOpen = document.getElementById("calc-box").open;
  if (b) pick = b.dataset.pick; else lang = lang === "ar" ? "en" : "ar";
  render();
});
window.addEventListener("beforeprint", () => { document.getElementById("calc-box").open = true; });
render();
</script>

</body>
</html>
